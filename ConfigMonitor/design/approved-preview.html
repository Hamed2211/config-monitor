<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600&family=Inter:wght@400;500;600&display=swap">
<style>
#mint-monitor{padding:20px 10px;font-family:Vazirmatn,Inter,sans-serif}
#mint-monitor *{box-sizing:border-box}
#mint-monitor .mm-app{--mm-bg:#0d1217;--mm-panel:#171d24;--mm-raised:#222b35;--mm-border:#252d37;--mm-text:#e7ecf3;--mm-muted:#9ca9bb;--mm-mint:#24cfa5;--mm-tint:#133b32;--mm-red:#ff6179;--mm-redbg:#2b171e;--mm-amber:#ffbd51;color-scheme:dark;max-width:398px;min-height:735px;margin:auto;border:1px solid var(--mm-border);border-radius:22px;background:var(--mm-bg);color:var(--mm-text);padding:20px;position:relative;display:flex;flex-direction:column;font-size:13px;line-height:1.65;overflow:hidden;box-shadow:0 22px 65px #0002}
#mint-monitor .mm-app.mm-light{--mm-bg:#f4f7f6;--mm-panel:#fff;--mm-raised:#e8eeeb;--mm-border:#dce5e1;--mm-text:#152922;--mm-muted:#596d64;--mm-mint:#087c61;--mm-tint:#d6f1e7;--mm-red:#c1374f;--mm-redbg:#fff0f2;--mm-amber:#925b06;color-scheme:light}
#mint-monitor .mm-app[lang=en]{font-family:Inter,Vazirmatn,sans-serif}
#mint-monitor button,#mint-monitor input,#mint-monitor select,#mint-monitor textarea{font:inherit}
#mint-monitor button{color:inherit;background:none;border:0;transition:background .2s,transform .16s;min-height:44px}
#mint-monitor button:active{transform:scale(.97)}
#mint-monitor button:focus-visible,#mint-monitor input:focus-visible,#mint-monitor textarea:focus-visible,#mint-monitor select:focus-visible{outline:2px solid var(--mm-mint);outline-offset:3px}
#mint-monitor h1,#mint-monitor h2,#mint-monitor h3,#mint-monitor p{margin:0;font-weight:500}
#mint-monitor h1{font-size:19px;letter-spacing:-.5px}
#mint-monitor h2{font-size:17px}
#mint-monitor h3{font-size:13px}
#mint-monitor .mm-muted{font-size:11px;color:var(--mm-muted);font-weight:400}
#mint-monitor .mm-en{font-family:Inter,sans-serif;direction:ltr}
#mint-monitor .mm-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
#mint-monitor .mm-head{display:flex;align-items:center;gap:10px;min-height:47px;margin-bottom:19px}
#mint-monitor .mm-head-title{flex:1;min-width:0}
#mint-monitor .mm-head-sub{display:flex;align-items:center;gap:5px;margin-top:1px}
#mint-monitor .mm-icon{width:42px;height:42px;min-height:42px;flex-shrink:0;background:var(--mm-panel);border:1px solid var(--mm-border);border-radius:13px;display:grid;place-items:center;color:var(--mm-muted)}
#mint-monitor .mm-icon svg{width:18px;height:18px}
#mint-monitor .mm-head-actions{display:flex;gap:7px}
#mint-monitor .mm-dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block;flex-shrink:0}
#mint-monitor .mm-good{color:var(--mm-mint)}
#mint-monitor .mm-bad{color:var(--mm-red)}
#mint-monitor .mm-slow{color:var(--mm-amber)}
#mint-monitor .mm-panel{border:1px solid var(--mm-border);border-radius:20px;background:var(--mm-panel);padding:17px}
#mint-monitor .mm-summary-top{display:flex;gap:17px;align-items:center}
#mint-monitor .mm-ring{width:80px;height:80px;flex-shrink:0;border-radius:50%;background:conic-gradient(var(--mm-mint) 0 var(--mm-angle),var(--mm-red) var(--mm-angle) 360deg);padding:7px;transform:rotate(-4deg)}
#mint-monitor .mm-ring-core{height:100%;border-radius:50%;background:var(--mm-panel);display:grid;place-items:center;font-size:24px;font-weight:600;transform:rotate(4deg)}
#mint-monitor .mm-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
#mint-monitor .mm-chip{display:inline-flex;align-items:center;gap:5px;background:var(--mm-raised);color:var(--mm-muted);border-radius:8px;padding:3px 7px;font-size:11px}
#mint-monitor .mm-chip.mm-bad{background:var(--mm-redbg);color:var(--mm-red)}
#mint-monitor .mm-summary-bottom{border-top:1px solid var(--mm-border);margin-top:15px;padding-top:9px}
#mint-monitor .mm-switch{display:flex;align-items:center;min-height:44px;min-width:44px}
#mint-monitor .mm-switch input{appearance:none;-webkit-appearance:none;width:41px;height:24px;border-radius:30px;background:var(--mm-raised);position:relative;margin:0;direction:ltr;transition:background .2s}
#mint-monitor .mm-switch input:before{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;background:#8e9bab;border-radius:50%;transition:transform .2s}
#mint-monitor .mm-switch input:checked{background:var(--mm-mint)}
#mint-monitor .mm-switch input:checked:before{background:#09291f;transform:translateX(17px)}
#mint-monitor .mm-tabs{display:flex;background:var(--mm-panel);border:1px solid var(--mm-border);padding:4px;border-radius:13px;gap:4px;margin:14px 0 10px}
#mint-monitor .mm-tabs button{flex:1;border-radius:9px;min-height:36px;color:var(--mm-muted);font-size:12px;padding:7px}
#mint-monitor .mm-tabs button.mm-selected{background:var(--mm-raised);color:var(--mm-text);font-weight:500}
#mint-monitor .mm-filters{display:flex;gap:6px;margin:10px 0 12px;flex-wrap:wrap}
#mint-monitor .mm-filters button{font-size:11px;min-height:36px;border-radius:20px;border:1px solid var(--mm-border);padding:5px 11px;color:var(--mm-muted)}
#mint-monitor .mm-filters button.mm-selected{background:var(--mm-tint);color:var(--mm-mint);border-color:color-mix(in srgb,var(--mm-mint) 35%,var(--mm-border))}
#mint-monitor .mm-item{display:flex;align-items:center;gap:10px;border:1px solid var(--mm-border);border-radius:16px;background:var(--mm-panel);padding:11px 12px;margin:8px 0;min-height:77px}
#mint-monitor .mm-item.mm-error{background:var(--mm-redbg);border-color:color-mix(in srgb,var(--mm-red) 16%,var(--mm-border))}
#mint-monitor .mm-item.mm-disabled{opacity:.55}
#mint-monitor .mm-item-main{flex:1;min-width:0;text-align:start;padding:0}
#mint-monitor .mm-item-title{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-weight:600;font-size:13px}
#mint-monitor .mm-proto{font-family:Inter,sans-serif;font-size:11px;font-weight:400;color:var(--mm-muted);border:1px solid var(--mm-border);padding:0 4px;border-radius:4px;letter-spacing:.2px}
#mint-monitor .mm-host{display:block;direction:ltr;text-align:start;font-family:monospace;font-size:11px;color:var(--mm-muted);line-height:1.5;overflow-wrap:anywhere;margin-top:2px}
#mint-monitor .mm-latency{font-size:14px;white-space:nowrap;font-weight:500;text-align:end}
#mint-monitor .mm-latency small{font-size:11px;font-weight:400;color:var(--mm-muted);display:block}
#mint-monitor .mm-screen{display:flex;flex-direction:column;flex:1;animation:mm-enter .2s ease both;min-width:0}
#mint-monitor .mm-body{flex:1}
#mint-monitor .mm-footer{display:flex;gap:9px;margin-top:25px;padding-top:12px}
#mint-monitor .mm-primary{display:flex;justify-content:center;align-items:center;gap:8px;width:100%;min-height:51px;background:var(--mm-mint);color:#071b14;font-weight:600;border-radius:15px;padding:10px 14px}
#mint-monitor .mm-light .mm-primary{color:#fff}
#mint-monitor .mm-primary svg{width:20px;height:20px}
#mint-monitor .mm-footer .mm-icon{background:var(--mm-tint);color:var(--mm-mint);height:51px;width:51px;border-color:color-mix(in srgb,var(--mm-mint) 25%,var(--mm-border))}
#mint-monitor .mm-caption{text-align:center;color:var(--mm-muted);font-size:11px;margin-top:12px}
#mint-monitor .mm-label{display:block;font-size:11px;color:var(--mm-muted);margin:15px 0 8px}
#mint-monitor .mm-field{display:block;width:100%;background:var(--mm-panel);border:1px solid var(--mm-border);border-radius:12px;padding:12px;color:var(--mm-text);font-size:14px;min-height:46px}
#mint-monitor textarea.mm-field{min-height:115px;resize:vertical;font-family:monospace;font-size:11px;line-height:1.9;border-color:color-mix(in srgb,var(--mm-mint) 55%,var(--mm-border))}
#mint-monitor .mm-protocols{display:flex;flex-wrap:wrap;gap:6px;direction:ltr;margin:10px 0 18px}
#mint-monitor .mm-protocols span{font:500 11px Inter,sans-serif;background:var(--mm-tint);color:var(--mm-mint);border-radius:4px;padding:4px 6px}
#mint-monitor .mm-parse-result{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--mm-panel);border-radius:10px;padding:9px 11px;margin:6px 0;font-size:11px}
#mint-monitor .mm-parse-result.mm-error{background:var(--mm-redbg);color:var(--mm-red)}
#mint-monitor .mm-parse-result svg{width:15px;height:15px;color:var(--mm-mint)}
#mint-monitor .mm-text-action{font-size:12px;color:var(--mm-mint);padding:8px}
#mint-monitor .mm-hero-stat{font-size:38px;font-weight:600;line-height:1.2;margin-top:8px;font-variant-numeric:tabular-nums}
#mint-monitor .mm-hero-stat small{font-size:12px;color:var(--mm-muted);font-weight:400}
#mint-monitor .mm-chart{margin-top:12px;padding:15px;border-radius:17px;background:var(--mm-panel);border:1px solid var(--mm-border)}
#mint-monitor .mm-chart svg{display:block;width:100%;height:125px;margin-top:10px;overflow:visible}
#mint-monitor .mm-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
#mint-monitor .mm-stat{background:var(--mm-panel);border-radius:13px;padding:11px 8px;text-align:center}
#mint-monitor .mm-stat strong{font-size:13px;font-weight:500;display:block;margin-top:3px}
#mint-monitor .mm-event{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12px}
#mint-monitor .mm-event time{margin-inline-start:auto;color:var(--mm-muted);font-size:11px}
#mint-monitor .mm-secondary{border:1px solid var(--mm-border);background:var(--mm-panel);border-radius:12px;min-height:45px;padding:8px 10px;font-size:11px;flex:1}
#mint-monitor .mm-secondary.mm-danger{color:var(--mm-red)}
#mint-monitor .mm-actions{display:flex;gap:8px;margin-top:8px}
#mint-monitor .mm-settings-group{border:1px solid var(--mm-border);background:var(--mm-panel);border-radius:17px;overflow:hidden;margin-bottom:20px}
#mint-monitor .mm-setting{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:12px 14px;min-height:56px;width:100%;text-align:start}
#mint-monitor .mm-setting+.mm-setting{border-top:1px solid var(--mm-border)}
#mint-monitor .mm-setting select{background:var(--mm-raised);color:var(--mm-text);border:0;border-radius:7px;padding:8px;max-width:125px;font-size:12px}
#mint-monitor .mm-setting svg{width:16px;height:16px;color:var(--mm-muted)}
#mint-monitor .mm-tone{width:100%;padding:11px 13px;display:flex;align-items:center;gap:11px;min-height:62px}
#mint-monitor .mm-tone+.mm-tone{border-top:1px solid var(--mm-border)}
#mint-monitor .mm-tone.mm-selected{background:var(--mm-tint);color:var(--mm-mint)}
#mint-monitor .mm-tone input{accent-color:var(--mm-mint);width:19px;height:19px;margin:0}
#mint-monitor .mm-tone label{flex:1;font-weight:500}
#mint-monitor .mm-tone button{width:37px;min-height:37px;height:37px;border:1px solid var(--mm-border);border-radius:50%;display:grid;place-items:center}
#mint-monitor .mm-tone svg{width:14px;height:14px}
#mint-monitor input[type=range]{width:100%;accent-color:var(--mm-mint);height:24px;margin:12px 0 0}
#mint-monitor input[type=checkbox]{accent-color:var(--mm-mint)}
#mint-monitor .mm-scan-stage{background:#080c10;margin:-20px;padding:20px;display:flex;flex-direction:column;min-height:733px;flex:1;color:#e7ecf3}
#mint-monitor .mm-scan-frame{width:230px;max-width:90%;aspect-ratio:1;margin:50px auto 20px;border:3px solid #24cfa5;border-radius:24px;position:relative;background:#10171d}
#mint-monitor .mm-scan-frame:before{content:'';position:absolute;inset:10% -3px;background:#10171d;border-left:3px solid #202a32;border-right:3px solid #202a32}
#mint-monitor .mm-scan-frame:after{content:'';position:absolute;height:2px;left:12px;right:12px;top:55%;background:#24cfa5;box-shadow:0 0 18px #24cfa5;animation:mm-scan 1.3s ease-out 1}
#mint-monitor .mm-scan-sheet{background:#171d24;border:1px solid #252d37;border-radius:25px 25px 0 0;margin:45px -20px -20px;padding:18px 20px 20px;margin-top:auto;color:#e7ecf3}
#mint-monitor .mm-handle{width:38px;height:4px;background:#35414e;border-radius:4px;margin:0 auto 15px}
#mint-monitor .mm-alert-center{display:flex;flex:1;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:24px 0}
#mint-monitor .mm-alert-icon{width:86px;height:86px;background:var(--mm-redbg);color:var(--mm-red);border-radius:28px;display:grid;place-items:center;margin-bottom:15px}
#mint-monitor .mm-alert-icon svg{width:38px;height:38px}
#mint-monitor .mm-fails{display:flex;gap:6px;justify-content:center;margin:20px 0 9px}
#mint-monitor .mm-fails span{width:26px;height:5px;border-radius:4px;background:var(--mm-red)}
#mint-monitor .mm-toast{position:absolute;bottom:90px;left:20px;right:20px;background:var(--mm-raised);border:1px solid var(--mm-border);color:var(--mm-text);padding:12px 14px;border-radius:13px;text-align:center;font-size:12px;z-index:10;box-shadow:0 8px 35px #0005}
#mint-monitor [hidden]{display:none!important}
@keyframes mm-enter{from{opacity:.6;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes mm-scan{from{top:20%}to{top:55%}}
@media(max-width:370px){#mint-monitor{padding:8px 0}#mint-monitor .mm-app{padding:15px;border-radius:17px}#mint-monitor .mm-head{gap:7px}#mint-monitor h1{font-size:18px}#mint-monitor .mm-item{gap:7px;padding:10px}#mint-monitor .mm-latency{font-size:12px}#mint-monitor .mm-ring{width:69px;height:69px}#mint-monitor .mm-scan-stage{margin:-15px;padding:15px}#mint-monitor .mm-scan-sheet{margin-inline:-15px;margin-bottom:-15px;padding:18px 15px}}
@media(prefers-reduced-motion:reduce){#mint-monitor *,#mint-monitor *:before,#mint-monitor *:after{animation:none!important;transition:none!important}}
</style>
<div id="mint-monitor" class="viz-dotted-background"><section class="mm-app" dir="rtl" lang="fa" aria-label="Config Monitor preview"><div id="mm-view" class="mm-screen"></div><div id="mm-toast" class="mm-toast" role="status" hidden></div></section></div>
<script>
(()=>{
const root=document.getElementById('mint-monitor'),app=root.querySelector('.mm-app'),view=root.querySelector('#mm-view'),toast=root.querySelector('#mm-toast');
let lang='fa',screen='home',category='config',filter='all',running=true,selected=1,tone=0,playing=-1,volume=80,vibrate=true,ramp=false,ack=false,mode='links',timer,editing=null,searching=false,search='';
let nodes=[{id:1,name:'Germany-01',p:'VLESS',host:'de1.example.com:443',transport:'reality',ms:128,state:'good',enabled:true,type:'config'},{id:2,name:'Nl-vmess',p:'VMESS',host:'nl1.example.com:443',transport:'ws · tls',ms:862,state:'slow',enabled:true,type:'config'},{id:3,name:'Tr-hy2',p:'HY2',host:'tr1.example.com:8443',transport:'hysteria2',ms:0,state:'bad',enabled:true,type:'config'},{id:4,name:'Us-ss',p:'SS',host:'us1.example.com:8388',transport:'tcp',ms:0,state:'off',enabled:false,type:'config'},{id:5,name:'Google',p:'HTTPS',host:'google.com',transport:'HTTPS',ms:54,state:'good',enabled:true,type:'address'},{id:6,name:'Cloudflare',p:'HTTPS',host:'cloudflare.com',transport:'HTTPS',ms:71,state:'good',enabled:true,type:'address'}];
const t=(fa,en)=>lang==='fa'?fa:en,num=x=>new Intl.NumberFormat(lang==='fa'?'fa-IR':'en-US').format(x),ico=x=>`<i data-lucide="${x}" aria-hidden="true"></i>`,esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),go=s=>{screen=s;render();},current=()=>nodes.find(x=>x.id===selected)||nodes[0];
function icons(){if(typeof lucide!=='undefined')lucide.createIcons({attrs:{width:18,height:18}});root.querySelectorAll('button,input[type=checkbox],input[type=radio]').forEach(x=>x.classList.add('cursor-interaction'));}
function notify(fa,en){toast.textContent=t(fa,en);toast.hidden=false;clearTimeout(timer);timer=setTimeout(()=>toast.hidden=true,2700);}
function toggle(on,key,label){return `<label class="mm-switch"><input type="checkbox" ${on?'checked':''} data-toggle="${key}" aria-label="${esc(label)}"></label>`;}
function header(title,back='home',sub=''){return `<header class="mm-head"><button class="mm-icon" data-go="${back}" aria-label="${t('بازگشت','Back')}">${ico(lang==='fa'?'arrow-right':'arrow-left')}</button><div class="mm-head-title"><h2>${title}</h2>${sub?`<div class="mm-muted">${sub}</div>`:''}</div></header>`;}
function stateLabel(o){return !o.enabled?t('متوقف','Paused'):o.state==='bad'?t('قطع','Down'):o.state==='slow'?t('کند','Slow'):t('سالم','Healthy');}
function nodeRow(o){return `<article class="mm-item ${!o.enabled?'mm-disabled':o.state==='bad'?'mm-error':''}"><span class="mm-dot ${o.enabled?'mm-'+o.state:'mm-muted'}"></span><button class="mm-item-main" data-detail="${o.id}"><span class="mm-item-title"><bdi class="mm-en">${esc(o.name)}</bdi><span class="mm-proto">${o.p}</span></span><span class="mm-host">${esc(o.host)} · ${esc(o.transport)}</span></button><div class="mm-latency ${o.enabled?'mm-'+o.state:'mm-muted'}">${!o.enabled?t('متوقف','Paused'):o.state==='bad'?t('قطع','Down'):`${num(o.ms)} <span class="mm-muted">ms</span>`}<small>${o.state==='bad'&&o.enabled?t('۶ خطا','6 failures'):o.state==='slow'&&o.enabled?t('کند','Slow'):''}</small></div>${toggle(o.enabled,'node-'+o.id,t('پایش ','Monitor ')+o.name)}</article>`;}
function home(){const items=nodes.filter(x=>x.type===category),active=items.filter(x=>x.enabled),healthy=active.filter(x=>x.state!=='bad'),failed=active.filter(x=>x.state==='bad');return `<header class="mm-head"><div class="mm-head-title"><h1 class="mm-en">Config Monitor</h1><div class="mm-head-sub mm-muted"><span class="mm-dot mm-good"></span>${t('پیش‌نمایش · آخرین بررسی: ۳ ثانیه پیش','Preview · checked 3 seconds ago')}</div></div><div class="mm-head-actions"><button class="mm-icon" data-search="1" aria-label="${t('جست‌وجو','Search')}">${ico('search')}</button><button class="mm-icon" data-go="settings" aria-label="${t('تنظیمات','Settings')}">${ico('sliders-horizontal')}</button></div></header><div class="mm-body"><section class="mm-panel"><div class="mm-summary-top"><div class="mm-ring" style="--mm-angle:${active.length?healthy.length/active.length*360:0}deg" role="img" aria-label="${healthy.length} healthy out of ${active.length}"><div class="mm-ring-core">${num(healthy.length)}</div></div><div><p class="mm-muted">${t('وضعیت کلی','Overall status')}</p><h2>${t(`${num(healthy.length)} از ${num(active.length)} سالم`,`${healthy.length} of ${active.length} healthy`)}</h2><div class="mm-chips"><button class="mm-chip mm-bad" data-go="alert" style="min-height:28px">${num(failed.length)} ${t('مورد قطع','down')}</button><span class="mm-chip">${t('هر ۲۰ ثانیه','Every 20 sec')}</span></div></div></div><div class="mm-row mm-summary-bottom"><h3>${running?t('مانیتورینگ فعال','Monitoring active'):t('مانیتورینگ متوقف','Monitoring paused')}</h3>${toggle(running,'running',t('مانیتورینگ','Monitoring'))}</div></section>${searching?`<label class="mm-label" for="mm-search">${t('جست‌وجوی مانیتور','Search monitors')}</label><input id="mm-search" class="mm-field" value="${esc(search)}" placeholder="${t('نام یا آدرس','Name or address')}">`:''}<div class="mm-tabs">${[['config','کانفیگ‌ها','Configs'],['address','آدرس‌ها','Addresses']].map(([v,fa,en])=>`<button data-category="${v}" class="${category===v?'mm-selected':''}" aria-pressed="${category===v}">${t(fa,en)} · ${num(nodes.filter(x=>x.type===v).length)}</button>`).join('')}</div><div class="mm-filters">${[['all','همه','All'],['bad','قطع','Down'],['slow','کند','Slow'],['off','متوقف','Paused']].map(([v,fa,en])=>`<button class="${filter===v?'mm-selected':''}" data-filter="${v}" aria-pressed="${filter===v}">${t(fa,en)} ${num(items.filter(o=>v==='all'||(v==='off'?!o.enabled:o.enabled&&o.state===v)).length)}</button>`).join('')}</div><div id="mm-list">${items.filter(o=>(filter==='all'||(filter==='off'?!o.enabled:o.enabled&&o.state===filter))&&(!search||(o.name+' '+o.host).toLowerCase().includes(search.toLowerCase()))).map(nodeRow).join('')||`<p class="mm-muted" style="padding:20px;text-align:center">${t('موردی پیدا نشد','No monitors found')}</p>`}</div></div><div class="mm-footer"><button class="mm-primary" data-add="1">${ico('plus')}${t('افزودن','Add monitor')}</button><button class="mm-icon" data-go="scan" aria-label="${t('اسکن QR','Scan QR')}">${ico('scan-line')}</button></div>`;}
function chart(o){const values=[120,136,116,143,128,155,130,152,137,112,135,149,124,109,132,145,118,137,156,131,112,136,148,123,141,165,137,146,128,128];const path=values.map((y,i)=>`${i?'L':'M'}${10+i*10},${110-y*.43}`).join(' ');return `<section class="mm-chart"><p class="mm-muted">${t('تأخیر ۳۰ بررسی اخیر','Last 30 checks')} · ms</p><svg viewBox="0 0 310 125" role="img" aria-label="Sample response times between 109 and 165 milliseconds"><path d="M10 25H300" stroke="var(--mm-border)" fill="none"/><path d="${path} L300 112 L10 112 Z" fill="var(--mm-tint)"/><path d="${path}" fill="none" stroke="var(--mm-mint)" stroke-width="1.7"/><circle cx="300" cy="54.96" r="3" fill="var(--mm-mint)"/><text x="10" y="20" fill="var(--mm-muted)" font-size="10" text-anchor="start">200</text></svg><div class="mm-row mm-muted"><span>${t('اکنون','Now')}</span><span>${t('۱۰ دقیقه پیش','10 minutes ago')}</span></div></section>`;}
function detail(){const o=current();return header(`<bdi class="mm-en">${esc(o.name)}</bdi> <span class="mm-proto">${o.p}</span>`,'home',`<bdi class="mm-host">${esc(o.host)} · ${esc(o.transport)}</bdi>`)+`<div class="mm-body"><div class="mm-panel mm-row"><div><p class="mm-muted mm-${o.state}">${stateLabel(o)} · ${t('۳ ثانیه پیش','3 sec ago')}</p><div class="mm-hero-stat mm-${o.state}">${o.state==='bad'?'—':num(o.ms)} <small>ms</small></div></div><div><p class="mm-muted">${t('آپ‌تایم ۲۴ ساعت','24-hour uptime')}</p><h2>${o.state==='bad'?t('۹۶٫۱٪','96.1%'):t('۹۹٫۲٪','99.2%')}</h2></div></div>${chart(o)}<div class="mm-stats"><div class="mm-stat"><span class="mm-muted">${t('میانگین','Average')}</span><strong>134 ms</strong></div><div class="mm-stat"><span class="mm-muted">${t('بهترین','Best')}</span><strong>109 ms</strong></div><div class="mm-stat"><span class="mm-muted">${t('بدترین','Worst')}</span><strong>165 ms</strong></div></div><div class="mm-panel"><p class="mm-muted">${t('رویدادها · نمونه','Events · sample')}</p><div class="mm-event"><span class="mm-dot mm-good"></span>${t('دوباره وصل شد','Connection restored')}<time>02:19</time></div><div class="mm-event"><span class="mm-dot mm-bad"></span>${t('قطع شد · ۵ دقیقه','Disconnected · 5 min')}<time>02:14</time></div></div><div class="mm-panel mm-row" style="padding:3px 14px;margin-top:12px"><h3>${t('پایش این کانفیگ فعال باشد','Monitor this config')}</h3>${toggle(o.enabled,'node-'+o.id,t('پایش کانفیگ','Monitor config'))}</div></div><div class="mm-footer"><button class="mm-primary" data-test="1">${t('تست همین الان','Test now')}</button></div><div class="mm-actions"><button class="mm-secondary" data-edit="1">${t('ویرایش','Edit')}</button><button class="mm-secondary" data-go="alert">${t('نمایش هشدار','Show alert')}</button><button class="mm-secondary mm-danger" data-go="delete">${t('حذف','Delete')}</button></div>`;}
function add(){const o=editing?nodes.find(x=>x.id===editing):null;return header(o?t('ویرایش کانفیگ','Edit config'):category==='address'?t('افزودن آدرس','Add address'):t('افزودن کانفیگ','Add configs'))+`<form id="mm-add-form" class="mm-screen"><div class="mm-body">${category==='config'?`<div class="mm-tabs">${[['links','لینک','Link'],['qr','QR','QR'],['sub','لینک ساب','Subscription']].map(([v,fa,en])=>`<button type="button" data-mode="${v}" class="${mode===v?'mm-selected':''}">${t(fa,en)}</button>`).join('')}</div><div class="mm-protocols">${['VLESS','VMESS','TROJAN','SS','HY2','TUIC','SOCKS'].map(p=>`<span>${p}</span>`).join('')}</div>`:''}<label class="mm-label" for="mm-name">${t('نام نمایشی','Display name')}</label><input class="mm-field" id="mm-name" name="name" value="${o?esc(o.name):''}" placeholder="${category==='address'?'Google':'Germany-01'}"><label class="mm-label" for="mm-links">${category==='address'?t('دامنه یا آدرس','Domain or address'):mode==='sub'?t('لینک اشتراک','Subscription URL'):t('لینک‌ها (هر لینک در یک خط)','Links (one per line)')}</label><textarea id="mm-links" class="mm-field" name="links" dir="ltr" required placeholder="${category==='address'?'google.com':mode==='sub'?'https://example.com/sub/…':'vless://…'}">${o?esc(category==='address'?o.host:o.p.toLowerCase()+'://sample@'+o.host):category==='config'&&mode==='links'?'vless://sample@de1.example.com:443#Germany-01\nvmess://sample-config\ntrojan://sample@fi1.example.com:443#Finland-03':''}</textarea>${category==='address'?`<label class="mm-label" for="mm-method">${t('روش بررسی','Check method')}</label><select id="mm-method" class="mm-field" name="method"><option>HTTPS</option><option>TCP</option><option>ICMP</option></select>`:''}<div id="mm-parse"></div></div><div class="mm-footer"><button class="mm-primary" type="submit">${o?t('ذخیره تغییرات','Save changes'):t('افزودن به مانیتورها','Add to monitors')}</button></div><p class="mm-caption">${t('پیش‌نمایش رابط کاربری؛ اعتبارسنجی واقعی انجام نمی‌شود','UI preview; real config validation is not performed')}</p></form>`;}
function scan(){return `<div class="mm-scan-stage">${header(t('اسکن QR','Scan QR'))}<div class="mm-scan-frame" role="img" aria-label="QR camera preview placeholder"></div><p class="mm-caption">${t('QR کانفیگ یا لینک ساب را داخل کادر بگیر','Place a config or subscription QR in the frame')}</p><p class="mm-caption">${t('دوربین در این پیش‌نمایش فعال نیست','Camera is not active in this preview')}</p><div class="mm-scan-sheet"><div class="mm-handle"></div><h3 class="mm-good">${t('۲ کانفیگ نمونه پیدا شد','2 sample configs found')}</h3><div class="mm-parse-result"><span class="mm-en">Germany-01</span><span class="mm-muted">VLESS · reality</span></div><div class="mm-parse-result"><span class="mm-en">Finland-03</span><span class="mm-muted">TROJAN · tls</span></div><button class="mm-primary" data-scan-add="1" style="margin-top:12px">${t('افزودن ۲ کانفیگ','Add 2 configs')}</button><button class="mm-text-action" data-gallery="1" style="width:100%">${t('انتخاب QR از گالری','Choose QR from gallery')}</button></div></div>`;}
function settings(){return header(t('تنظیمات','Settings'))+`<div class="mm-body"><p class="mm-label">${t('هشدار','Alerts')}</p><div class="mm-settings-group"><button class="mm-setting" data-go="tones"><span><h3>${t('زنگ آلرت','Alert sound')}</h3><span class="mm-muted">${toneName(tone)}</span></span>${ico(lang==='fa'?'chevron-left':'chevron-right')}</button><button class="mm-setting" data-go="alert"><h3>${t('پیش‌نمایش هشدار','Preview alert')}</h3>${ico('bell-ring')}</button><div class="mm-setting"><h3>${t('آستانه هشدار','Alert threshold')}</h3><span class="mm-muted">${t('۶ شکست متوالی','6 consecutive failures')}</span></div><div class="mm-setting"><h3>${t('فاصله بررسی','Check interval')}</h3><span class="mm-muted">${t('۲۰ ثانیه','20 seconds')}</span></div></div><p class="mm-label">${t('ظاهر و زبان','Appearance & language')}</p><div class="mm-settings-group"><div class="mm-setting"><label for="mm-language">${t('زبان','Language')}</label><select id="mm-language"><option value="fa" ${lang==='fa'?'selected':''}>فارسی</option><option value="en" ${lang==='en'?'selected':''}>English</option></select></div><div class="mm-setting"><h3>${t('حالت تیره','Dark mode')}</h3>${toggle(!app.classList.contains('mm-light'),'theme',t('حالت تیره','Dark mode'))}</div></div><p class="mm-muted">${t('تست واقعی کانفیگ بدون روشن‌شدن VPN گوشی','Real config checks without activating device VPN')}</p></div><p class="mm-caption">Config Monitor · ${t('پیش‌نمایش طراحی','Design preview')}</p>`;}
function toneName(i){return [['سایرن','Siren'],['ضربان','Pulse'],['فانوس','Beacon'],['کلاسیک','Classic']][i][lang==='fa'?0:1];}
function tones(){return header(t('زنگ آلرت','Alert sound'),'settings')+`<div class="mm-body"><p class="mm-label">${t('زنگ‌های داخلی','Built-in sounds')}</p><div class="mm-settings-group">${[0,1,2,3].map(i=>`<div class="mm-tone ${tone===i?'mm-selected':''}"><input type="radio" name="tone" id="mm-tone-${i}" value="${i}" ${tone===i?'checked':''}><label for="mm-tone-${i}">${toneName(i)}</label><button data-play="${i}" aria-label="${t('پیش‌نمایش ','Preview ')+toneName(i)}">${ico(playing===i?'square':'play')}</button></div>`).join('')}</div><p class="mm-label">${t('از گوشی','From device')}</p><div class="mm-settings-group"><button class="mm-setting" data-system-sound="1"><span><h3>${t('زنگ‌های سیستم','System sounds')}</h3><span class="mm-muted">Alarm · Cesium</span></span>${ico(lang==='fa'?'chevron-left':'chevron-right')}</button><button class="mm-setting" data-file-sound="1"><span><h3>${t('فایل صوتی دلخواه','Custom audio file')}</h3><span class="mm-muted">${t('انتخاب از حافظه گوشی','Choose from device storage')}</span></span>${ico(lang==='fa'?'chevron-left':'chevron-right')}</button></div><p class="mm-label">${t('شدت','Intensity')}</p><div class="mm-settings-group"><div class="mm-setting" style="display:block"><label class="mm-row" for="mm-volume"><span>${t('بلندی صدا','Alarm volume')}</span><span id="mm-volume-label" class="mm-good">${num(volume)}٪</span></label><input id="mm-volume" type="range" value="${volume}" min="0" max="100" dir="ltr"></div><div class="mm-setting"><h3>${t('لرزش','Vibration')}</h3>${toggle(vibrate,'vibrate',t('لرزش','Vibration'))}</div><div class="mm-setting"><h3>${t('شروع آرام و بلندشدن تدریجی','Gradually increase volume')}</h3>${toggle(ramp,'ramp',t('افزایش تدریجی صدا','Gradually increase volume'))}</div></div><p class="mm-caption">${t('حالت سایلنت: نیازمند تنظیمات آلارم دستگاه','Silent mode requires device alarm settings')}</p><p class="mm-caption">${t('در این پیش‌نمایش صدایی پخش نمی‌شود','This preview does not play audio')}</p></div>`;}
function alert(){return header(t('هشدار کانفیگ','Config alert'))+`<div class="mm-alert-center"><div class="mm-alert-icon">${ico(ack?'bell-off':'bell-ring')}</div><h2>${ack?t('هشدار تأیید شد','Alert acknowledged'):t('کانفیگ پاسخ نمی‌دهد','Config is not responding')}</h2><p class="mm-muted">${t('Tr-hy2 به بررسی نیاز دارد','Tr-hy2 needs attention')}</p><div class="mm-panel" style="width:100%;margin-top:15px"><h2 class="mm-en">Tr-hy2</h2><p class="mm-muted mm-en">Hysteria2 · tr1.example.com:8443</p><div class="mm-fails">${'<span></span>'.repeat(6)}</div><p class="mm-bad">${t('۶ بررسی ناموفق پشت سر هم','6 consecutive failed checks')}</p></div><p class="mm-muted">${t('با تأیید هشدار، پایش ادامه پیدا می‌کند','Monitoring continues after acknowledgement')}</p></div><button class="mm-primary" data-ack="1">${ico('check')}${t('متوجه شدم','Got it')}</button><p class="mm-caption">${t('پیش‌نمایش بدون صدا','Silent preview')}</p>`;}
function parse(){const input=root.querySelector('#mm-links'),box=root.querySelector('#mm-parse');if(!input||!box||category==='address'||mode==='sub')return;const lines=input.value.split(/\n/).filter(s=>s.trim());const valid=lines.filter(s=>/^(vless|vmess|trojan|ss|ssr|hy2|hysteria2|tuic|socks5?):\/\//i.test(s));box.innerHTML=`<p class="mm-label mm-good">${num(valid.length)} ${t('لینک شناسایی‌شده','links recognized')}</p>`+lines.slice(0,5).map((s,i)=>{const ok=valid.includes(s),p=s.split('://')[0].toUpperCase(),title=s.includes('#')?s.split('#').pop():`Config-${i+1}`;return `<div class="mm-parse-result ${ok?'':'mm-error'}"><span class="mm-en">${esc(title)}</span><span class="mm-muted">${esc(p)}</span>${ico(ok?'check':'x')}</div>`;}).join('');icons();}
function render(){app.lang=lang;app.dir=lang==='fa'?'rtl':'ltr';view.innerHTML=screen==='home'?home():screen==='detail'?detail():screen==='add'?add():screen==='scan'?scan():screen==='settings'?settings():screen==='tones'?tones():screen==='alert'?alert():header(t('حذف مانیتور','Delete monitor'),'detail')+`<div class="mm-alert-center"><h2>${esc(current().name)}</h2><p class="mm-muted">${t('این مانیتور از فهرست حذف شود؟','Remove this monitor from the list?')}</p></div><div class="mm-actions"><button class="mm-secondary" data-go="detail">${t('انصراف','Cancel')}</button><button class="mm-primary" data-delete="1">${t('حذف','Delete')}</button></div>`;icons();if(screen==='add')parse();}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.go){go(d.go);}else if(d.search){searching=!searching;render();if(searching)root.querySelector('#mm-search').focus();}else if(d.category){category=d.category;filter='all';render();}else if(d.filter){filter=d.filter;render();}else if(d.detail){selected=+d.detail;go('detail');}else if(d.add){editing=null;mode='links';go('add');}else if(d.edit){editing=selected;category=current().type;mode='links';go('add');}else if(d.mode){mode=d.mode;mode==='qr'?go('scan'):render();}else if(d.ack){ack=true;go('home');notify('هشدار تأیید شد؛ پایش ادامه دارد','Alert acknowledged; monitoring continues');}else if(d.delete){nodes=nodes.filter(o=>o.id!==selected);go('home');notify('مانیتور حذف شد','Monitor removed');}else if(d.test){notify('این پیش‌نمایش است؛ تست شبکه انجام نمی‌شود','This is a preview; no network test is performed');}else if(d.play!==undefined){playing=playing===+d.play?-1:+d.play;tone=+d.play;render();if(playing>=0)notify('نمایش حالت پخش؛ بدون صدای واقعی','Playback state preview; no actual sound');}else if(d.systemSound||d.fileSound){notify('انتخاب فایل و زنگ سیستم در نسخه اندروید فعال می‌شود','Device sound selection will be available in the Android app');}else if(d.gallery){notify('ورود QR از تصویر در نسخه اندروید فعال می‌شود','QR image import will be available in the Android app');}else if(d.scanAdd){nodes.push({id:Date.now(),name:'Germany-QR',p:'VLESS',host:'de1.example.com:443',transport:'reality',ms:128,state:'good',enabled:true,type:'config'},{id:Date.now()+1,name:'Finland-QR',p:'TROJAN',host:'fi1.example.com:443',transport:'tls',ms:145,state:'good',enabled:true,type:'config'});category='config';go('home');notify('۲ کانفیگ نمونه اضافه شد','2 sample configs added');}});
root.addEventListener('change',e=>{const el=e.target,key=el.dataset.toggle;if(key==='running')running=el.checked;else if(key==='theme')app.classList.toggle('mm-light',!el.checked);else if(key==='vibrate')vibrate=el.checked;else if(key==='ramp')ramp=el.checked;else if(key&&key.startsWith('node-')){const o=nodes.find(x=>x.id===+key.slice(5));o.enabled=el.checked;if(o.state==='off')o.state='good';}else if(el.id==='mm-language')lang=el.value;else if(el.name==='tone')tone=+el.value;else return;render();});
root.addEventListener('input',e=>{if(e.target.id==='mm-links')parse();if(e.target.id==='mm-volume'){volume=+e.target.value;root.querySelector('#mm-volume-label').textContent=num(volume)+'٪';}if(e.target.id==='mm-search'){search=e.target.value;const pos=e.target.selectionStart;render();const field=root.querySelector('#mm-search');field.focus();field.setSelectionRange(pos,pos);}});
root.addEventListener('submit',e=>{if(e.target.id!=='mm-add-form')return;e.preventDefault();if(mode==='sub'&&category==='config'){notify('دریافت اشتراک در پیش‌نمایش انجام نمی‌شود','Subscription fetching is not available in this preview');return;}const fd=new FormData(e.target),lines=String(fd.get('links')).split(/\n/).map(s=>s.trim()).filter(Boolean),display=String(fd.get('name')).trim();if(category==='config'&&lines.some(s=>!/^(vless|vmess|trojan|ss|ssr|hy2|hysteria2|tuic|socks5?):\/\//i.test(s))){notify('فرمت یکی از لینک‌ها شناخته نشد','One link format was not recognized');return;}const created=lines.map((s,i)=>({id:editing||Date.now()+i,name:display||(s.includes('#')?s.split('#').pop():category==='address'?s:'Config-'+(nodes.length+i+1)),p:category==='address'?String(fd.get('method')):s.split('://')[0].toUpperCase(),host:category==='address'?s:'server.example.com:443',transport:category==='address'?String(fd.get('method')):'tls',ms:128,state:'good',enabled:true,type:category}));if(editing)nodes=nodes.map(o=>o.id===editing?created[0]:o);else nodes.push(...created);filter='all';go('home');notify('در پیش‌نمایش ذخیره شد؛ تست واقعی انجام نشده','Saved in preview; no real test performed');});
render();
})();
</script>
